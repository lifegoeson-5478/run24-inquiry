<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기기 오작동 문의 유형</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1b1f24; --muted: #6b7280; --line: #e6e8ec;
    --accent: #2563eb; --accent-soft: #e8efff; --bar-soft: #bfd0f7;
    --up: #dc2626; --up-bg: #fde8e8; --down: #15803d; --down-bg: #e3f6e9;
    --warn-bg: #fef3c7; --warn: #92400e; --est: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #9aa1ab; --line: #2a2f37;
      --accent: #60a5fa; --accent-soft: #1c2b44; --bar-soft: #2c4a7a;
      --up: #f87171; --up-bg: #3a1d1d; --down: #4ade80; --down-bg: #15301f;
      --warn-bg: #3b2f12; --warn: #fcd34d; --est: #a78bfa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 17px; margin: 0; }
  h3 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border-radius: 8px; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .center { text-align: center; padding: 64px 16px; }
  .warn { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tabs .cnt { display: inline-block; min-width: 1em; margin-left: 4px; color: #fff; background: var(--up); border-radius: 999px; font-size: 11px; padding: 0 6px; }
  .tabs .cnt:empty { display: none; }
  .syncline { margin: 0 0 10px; }
  .small { display: block; font-size: 12px; margin-top: 2px; }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .tagchip { display: inline-block; font-size: 12px; border-radius: 6px; padding: 1px 6px; margin: 1px 0; background: var(--bg); border: 1px solid var(--line); }
  .tagchip.old { text-decoration: line-through; color: var(--muted); }
  .tagchip.new { background: var(--accent-soft); border-color: var(--accent); }
  .arrow { color: var(--muted); }
  .why { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .why.rej { color: var(--up); }
  .sugg .tagcol { min-width: 200px; }
  .acts-btns { display: flex; gap: 4px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
  .search { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: min(320px, 100%); margin-right: 8px; }
  .crit .tagname { width: 34%; font-weight: 600; }
  .crit textarea { width: 100%; font: inherit; font-size: 14px; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; resize: vertical; }
  .critbar { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  @media (max-width: 640px) {
    .sugg thead { display: none; }
    .sugg tr { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    .sugg td { border: 0; padding: 0; }
    .sugg td.m, .sugg td.tagcol, .sugg td.go { grid-column: 1 / -1; }
    .sugg td.go { text-align: left; }
    .acts-btns { justify-content: flex-start; }
    .crit .tagname { width: auto; }
  }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi .v { font-size: 22px; font-weight: 700; }
  .kpi .k { font-size: 13px; color: var(--muted); }

  .layout { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 14px; align-items: start; }
  .side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 8px; }
  .side .hint { padding: 4px 8px 8px; }
  .type { display: grid; grid-template-columns: minmax(0, 1fr) 72px auto; align-items: center; gap: 4px 10px;
    width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 9px 8px; }
  .type:hover { background: var(--accent-soft); }
  .type[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .type .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type .meta { grid-column: 1; font-size: 12px; color: var(--muted); }
  .type .total { grid-column: 3; grid-row: 1 / span 2; text-align: right; font-weight: 700; white-space: nowrap; }
  .spark { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: flex-end; gap: 1px; height: 26px; }
  .spark i { flex: 1; background: var(--accent); border-radius: 1px; min-height: 1px; }
  .spark i.cur { background: var(--bar-soft); }
  .unk-sep { border-top: 1px solid var(--line); margin: 8px 8px 0; padding-top: 8px; font-size: 12px; }
  .type.unk { opacity: .6; }
  .type.unk .spark i { background: var(--muted); }

  .chg { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 0 7px; white-space: nowrap; }
  .chg.up { color: var(--up); background: var(--up-bg); }
  .chg.down { color: var(--down); background: var(--down-bg); }
  .chg.same { color: var(--muted); background: var(--bg); }

  .detail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .detail-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .back { display: none; }
  .trend { display: flex; align-items: flex-end; gap: 6px; height: 150px; overflow-x: auto; padding-top: 4px; }
  .trend button { flex: 1 0 40px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    height: 100%; border: 0; background: none; padding: 0 0 2px; border-radius: 6px; }
  .trend button:hover { background: var(--accent-soft); }
  .trend .bar { width: 70%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .trend .cur .bar { background: var(--bar-soft); }
  .trend .on { background: var(--accent-soft); outline: 2px solid var(--accent); }
  .trend .v { font-size: 12px; }
  .trend .l { font-size: 11px; color: var(--muted); white-space: nowrap; margin-top: 4px; line-height: 1.2; text-align: center; }

  .trend .act { box-shadow: inset 0 -3px 0 var(--est); }
  .trend .flag { font-size: 10px; font-weight: 700; color: #fff; background: var(--est); border-radius: 4px; padding: 0 4px; margin-bottom: 2px; }
  .compare { margin: 0 0 10px; }
  .acts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; font-size: 14px; }
  .acts li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 12px; }
  .act-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .act-form input { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .act-form input[type=text] { flex: 1 1 220px; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip b { font-weight: 600; margin-left: 4px; }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .filter { background: var(--accent-soft); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; }
  .filter button { border: 0; background: none; padding: 0 6px; color: var(--muted); }
  .list { width: 100%; border-collapse: collapse; font-size: 14px; }
  .list th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; }
  .list td { padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  .list .d { white-space: nowrap; }
  .list .s { white-space: nowrap; }
  .list .go { white-space: nowrap; text-align: right; }
  .list .sum { font-weight: 500; }
  .badge { display: inline-block; font-size: 11px; color: var(--est); border: 1px solid var(--est); border-radius: 999px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
  .more { width: 100%; margin-top: 10px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; max-height: none; }
    .layout.picked .side { display: none; }
    .layout:not(.picked) .detail { display: none; }
    .back { display: inline-block; }
  }
  @media (max-width: 560px) {
    .kpis { grid-template-columns: 1fr 1fr; }
    .kpis .kpi:last-child { grid-column: 1 / -1; }
    .list .s { display: none; }
    .list td.m .store { display: block; font-size: 12px; color: var(--muted); }
  }
  @media (min-width: 561px) { .list td.m .store { display: none; } }
</style>
</head>
<body>
<main id="app"><p class="center muted">불러오는 중…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://dnazztgpzfpcezsadyaz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_cuPnQYSO5_hIoNvfLovPPw_VFUnx0u4'; // 공개용 키
const COMPANY_DOMAIN = 'lifegoeson.kr'; // 화면 안내용. 실제 차단은 DB(RLS)에서 한다.
const CHANNEL_DESK = (channelId, chatId) => `https://desk.channel.io/#/channels/${channelId}/user_chats/${chatId}`;
const PAGE = 50;
const UNKNOWN = '세부유형 미지정';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const db = sb.schema('run24');
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kst = (iso, opts) => new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', ...opts });

// ── 보름 구간: 'YYYY-MM-01' 또는 'YYYY-MM-16' (한국 시간 기준)
function periodOf(date) {
  const [y, m, d] = date.toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }).split('-');
  return `${y}-${m}-${+d > 15 ? '16' : '01'}`;
}
function periodsFrom(start) {
  const out = [], end = periodOf(new Date());
  let [y, m, d] = start.split('-').map(Number);
  for (let p = start; p <= end; ) {
    out.push(p);
    if (d === 1) d = 16; else { d = 1; m++; if (m > 12) { m = 1; y++; } }
    p = `${y}-${String(m).padStart(2, '0')}-${d === 1 ? '01' : '16'}`;
  }
  return out;
}
const periodLabel = (p) => `${+p.slice(5, 7)}월 ${p.endsWith('01') ? '1~15일' : '16일~말'}`;
const shortLabel = (p) => `${+p.slice(5, 7)}/${p.endsWith('01') ? '1~15' : '16~'}`;

function change(now, before) {
  const diff = now - before;
  if (!before && !now) return '<span class="chg same">0</span>';
  if (diff === 0) return '<span class="chg same">변화 없음</span>';
  // 기준 건수가 적으면 %가 과장돼 보여서(1→7건 = +600%) 10건 이상일 때만 %를 붙인다.
  const pct = before >= 10 ? ` (${diff > 0 ? '+' : ''}${Math.round((diff / before) * 100)}%)` : '';
  return `<span class="chg ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff)}${pct}</span>`;
}

// ── 화면 상태. URL 해시에 넣어서 링크로 공유할 수 있게 한다.
const S = { periods: [], types: [], byType: new Map(), actions: [], type: null, period: null, store: null, rows: null, shown: PAGE, email: '',
  tab: 'dash', approver: false, sugStatus: 'pending', sugShown: PAGE };
const TABS = { dash: '대시보드', sugg: '태그 제안', crit: '분류 기준' };
const todayKst = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' });

// 가장 최근 조치를 기준으로, 조치한 보름을 빼고 그 전 3구간과 그 후(진행 중인 보름 제외) 최대 3구간의 평균을 비교한다.
function beforeAfter(m, actedOn) {
  const P = S.periods, cur = P.at(-1), ap = periodOf(new Date(actedOn)), i = P.indexOf(ap);
  if (i < 0) return null;
  const avg = (ps) => ps.length ? ps.reduce((s, p) => s + (m[p] || 0), 0) / ps.length : null;
  const before = P.slice(Math.max(0, i - 3), i), after = P.slice(i + 1).filter((p) => p !== cur).slice(0, 3);
  return { before: avg(before), after: avg(after), nBefore: before.length, nAfter: after.length };
}
function readHash() {
  let hash = location.hash;
  try { if (!/type=|tab=/.test(hash)) hash = sessionStorage.getItem('run24-hash') || hash; sessionStorage.removeItem('run24-hash'); } catch {}
  const h = new URLSearchParams(hash.slice(1));
  S.type = h.get('type'); S.period = h.get('period'); S.store = h.get('store');
  S.tab = TABS[h.get('tab')] ? h.get('tab') : 'dash';
}
function writeHash() {
  const h = new URLSearchParams();
  if (S.tab !== 'dash') h.set('tab', S.tab);
  else if (S.type) h.set('type', S.type);
  if (S.tab === 'dash' && S.period) h.set('period', S.period);
  if (S.tab === 'dash' && S.store) h.set('store', S.store);
  history.replaceState(null, '', h.toString() ? '#' + h : location.pathname);
}

function login() {
  app.innerHTML = `<div class="center"><h1>기기 오작동 문의 유형</h1>
    <p class="muted">회사 구글 계정(@${COMPANY_DOMAIN})으로 로그인해 주세요.</p>
    <button class="btn primary" id="go">구글로 로그인</button></div>`;
  // 공유받은 링크(#type=…)로 들어왔다면 로그인 후 같은 화면으로 돌아오도록 기억해 둔다.
  try { if (/type=|tab=/.test(location.hash)) sessionStorage.setItem('run24-hash', location.hash); } catch {}
  document.getElementById('go').onclick = () => sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname, queryParams: { hd: COMPANY_DOMAIN } },
  });
}

function notCompany(email) {
  app.innerHTML = `<div class="center"><h1>접근 권한이 없어요</h1>
    <p class="muted">${esc(email)} 계정은 볼 수 없어요. 회사 계정(@${COMPANY_DOMAIN})으로 로그인해 주세요.</p>
    <button class="btn" id="out">로그아웃</button></div>`;
  document.getElementById('out').onclick = async () => { await sb.auth.signOut(); login(); };
}

async function dashboard(email) {
  S.email = email;
  const [{ data: rows, error }, { data: sync }, { data: actions }] = await Promise.all([
    db.from('type_half_month').select('device_type, period_start, cnt'),
    db.from('sync_state').select('last_synced_at, last_error').maybeSingle(),
    db.from('actions').select('id, device_type, acted_on, note, created_by').order('acted_on'),
  ]);
  S.actions = actions || [];
  if (error) { document.getElementById('view').innerHTML = `<div class="warn">데이터를 불러오지 못했어요: ${esc(error.message)}</div>`; return; }

  const first = rows.reduce((a, r) => (r.period_start < a ? r.period_start : a), periodOf(new Date()));
  S.periods = periodsFrom(first);
  S.byType = new Map();
  for (const r of rows) {
    if (!S.byType.has(r.device_type)) S.byType.set(r.device_type, {});
    S.byType.get(r.device_type)[r.period_start] = r.cnt;
  }
  const P = S.periods, cur = P.at(-1), last = P.at(-2), prev = P.at(-3), recent = P.slice(-6);
  const sum = (m, ps) => ps.reduce((s, p) => s + (m[p] || 0), 0);
  S.types = [...S.byType.entries()]
    .map(([name, m]) => ({ name, m, total: sum(m, recent), last: m[last] || 0, prev: m[prev] || 0 }))
    .sort((a, b) => (a.name === UNKNOWN) - (b.name === UNKNOWN) || b.total - a.total); // 미지정은 맨 아래
  const all = Object.fromEntries(P.map((p) => [p, S.types.reduce((s, t) => s + (t.m[p] || 0), 0)]));
  const grand = sum(all, recent);

  document.getElementById('view').innerHTML = `
    <p class="muted syncline">마지막 갱신 ${sync?.last_synced_at ? kst(sync.last_synced_at, { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'} (매일 새벽 4시)</p>
    ${sync?.last_error ? `<div class="warn">최근 갱신에 실패했어요. 숫자가 최신이 아닐 수 있어요. (${esc(sync.last_error)})</div>` : ''}
    <section class="kpis">
      <div class="card kpi"><div class="k">최근 3개월 오작동 문의</div><div class="v num">${grand.toLocaleString()}건</div></div>
      <div class="card kpi"><div class="k">지난 보름 (${periodLabel(last ?? cur)})</div>
        <div class="v num">${(all[last] || 0).toLocaleString()}건 ${last && prev ? change(all[last] || 0, all[prev] || 0) : ''}</div></div>
      <div class="card kpi"><div class="k">이번 보름 (${periodLabel(cur)}, 진행 중)</div><div class="v num">${(all[cur] || 0).toLocaleString()}건</div></div>
    </section>
    <div class="layout" id="layout">
      <nav class="card side" aria-label="유형 목록">
        <div class="hint muted">최근 3개월 많은 순 · 증감은 지난 보름과 그 전 보름 비교</div>
        ${S.types.map((t) => {
          const max = Math.max(1, ...P.map((p) => t.m[p] || 0)); // 유형마다 자기 최대값 기준
          return `${t.name === UNKNOWN ? '<div class="muted unk-sep">태그에 세부유형이 없고 내용으로도 알 수 없는 문의</div>' : ''}
          <button class="type ${t.name === UNKNOWN ? 'unk' : ''}" data-type="${esc(t.name)}">
            <span class="name">${esc(t.name)}</span>
            <span class="spark" aria-hidden="true">${P.slice(-12).map((p) =>
              `<i class="${p === cur ? 'cur' : ''}" style="height:${((t.m[p] || 0) / max) * 100}%"></i>`).join('')}</span>
            <span class="total num">${t.total}건</span>
            <span class="meta">${grand ? Math.round((t.total / grand) * 100) : 0}% · ${last && prev ? change(t.last, t.prev) : ''}</span>
          </button>`;
        }).join('')}
      </nav>
      <section class="detail" id="detail"></section>
    </div>`;

  for (const b of app.querySelectorAll('.type')) b.onclick = () => pick(b.dataset.type, true);
  pick(S.byType.has(S.type) ? S.type : S.types[0]?.name, false, true);
}

async function pick(type, userClick, keepFilters) {
  if (!type) return;
  if (!keepFilters) { S.period = null; S.store = null; }
  S.type = type; S.rows = null; S.shown = PAGE;
  writeHash();
  for (const b of app.querySelectorAll('.type')) b.setAttribute('aria-current', String(b.dataset.type === type));
  const layout = document.getElementById('layout');
  if (userClick) layout.classList.add('picked');
  renderDetail();
  if (userClick && innerWidth <= 900) scrollTo({ top: layout.offsetTop - 8 });

  // 이 유형의 문의를 모두 가져와서 매장·기간 필터는 화면에서 처리한다 (유형당 수백 건 수준).
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await db.from('chat_list')
      .select('chat_id, channel_id, opened_at, store, first_message, estimated, summary')
      .eq('device_type', type).order('opened_at', { ascending: false }).range(from, from + 999);
    if (S.type !== type) return;
    if (error) { S.rows = { error: error.message }; return renderDetail(); }
    rows.push(...data);
    if (data.length < 1000) break;
  }
  for (const r of rows) r.period = periodOf(new Date(r.opened_at));
  S.rows = rows;
  renderDetail();
}

function renderDetail() {
  const el = document.getElementById('detail');
  const t = S.types.find((x) => x.name === S.type);
  if (!t) { el.innerHTML = ''; return; }
  const P = S.periods, cur = P.at(-1);
  const max = Math.max(1, ...P.map((p) => t.m[p] || 0));
  const loaded = Array.isArray(S.rows);

  // 개선 조치: 추이에 표시하고, 가장 최근 조치 기준으로 전후 평균을 비교한다.
  const acts = S.actions.filter((a) => a.device_type === t.name).sort((a, b) => (a.acted_on < b.acted_on ? -1 : a.acted_on > b.acted_on ? 1 : 0));
  const actPeriods = new Set(acts.map((a) => periodOf(new Date(a.acted_on))));
  const latest = acts.at(-1);
  let compare = '';
  if (latest) {
    const ba = beforeAfter(t.m, latest.acted_on);
    const fmt = (v) => (v === null ? '-' : `${Math.round(v * 10) / 10}건`);
    if (!ba) compare = '<p class="muted">조치일이 데이터 기간 밖이라 비교할 수 없어요.</p>';
    else if (!ba.nAfter) compare = `<p class="muted">${esc(latest.acted_on)} 조치 이후 끝난 보름이 아직 없어요. 다음 보름이 끝나면 비교가 보여요.</p>`;
    else {
      const d = ba.before ? Math.round(((ba.after - ba.before) / ba.before) * 100) : null;
      compare = `<p class="compare">최근 조치(${esc(latest.acted_on)}) 전 보름 평균 <b class="num">${fmt(ba.before)}</b> → 이후 <b class="num">${fmt(ba.after)}</b>
        ${d === null ? '' : `<span class="chg ${d < 0 ? 'down' : d > 0 ? 'up' : 'same'}">${d > 0 ? '+' : ''}${d}%</span>`}
        <span class="muted">(전 ${ba.nBefore}구간, 후 ${ba.nAfter}구간 · 조치한 보름은 제외)</span></p>`;
    }
  }
  const actionsHtml = `
    ${compare}
    ${acts.length ? `<ul class="acts">${acts.slice().reverse().map((a) => `<li>
      <span class="num">${esc(a.acted_on)}</span> <span>${esc(a.note) || '<span class="muted">(메모 없음)</span>'}</span>
      <span class="muted">${esc(a.created_by.split('@')[0])}</span>
      ${a.created_by === S.email ? `<button class="link" data-del="${a.id}" aria-label="조치 기록 삭제">삭제</button>` : ''}</li>`).join('')}</ul>`
      : '<p class="muted">아직 기록이 없어요. 이 유형에 개선 조치를 했다면 날짜를 남겨 주세요. 추이 그래프에 표시돼요.</p>'}
    <form class="act-form" id="act-form">
      <input type="date" name="d" value="${todayKst()}" max="${todayKst()}" required aria-label="조치일">
      <input type="text" name="n" maxlength="200" placeholder="무엇을 했나요? (예: 건조기 필터 전 매장 교체)" aria-label="조치 내용">
      <button class="btn primary" type="submit">기록</button>
    </form>`;

  // 매장별 건수: 선택한 기간이 있으면 그 기간 기준
  let storeChips = '<p class="muted">불러오는 중…</p>';
  if (loaded) {
    const counts = {};
    for (const r of S.rows) if (!S.period || r.period === S.period) counts[r.store] = (counts[r.store] || 0) + 1;
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    storeChips = top.length ? `<div class="chips">${top.slice(0, 15).map(([s, n]) =>
      `<button class="chip ${S.store === s ? 'on' : ''}" data-store="${esc(s)}">${esc(s)}<b class="num">${n}</b></button>`).join('')}
      ${top.length > 15 ? `<span class="muted">외 ${top.length - 15}곳</span>` : ''}</div>` : '<p class="muted">없음</p>';
  }

  let listHtml = '<p class="muted">불러오는 중…</p>';
  if (S.rows?.error) listHtml = `<div class="warn">목록을 불러오지 못했어요: ${esc(S.rows.error)}</div>`;
  else if (loaded) {
    const rows = S.rows.filter((r) => (!S.period || r.period === S.period) && (!S.store || r.store === S.store));
    const est = rows.filter((r) => r.estimated).length;
    listHtml = `
      <div class="filters">
        <span class="muted">${rows.length.toLocaleString()}건${est ? ` · 그중 ${est}건은 메시지로 추정한 유형` : ''}</span>
        ${S.period ? `<span class="filter">${periodLabel(S.period)}<button data-clear="period" aria-label="기간 필터 해제">✕</button></span>` : ''}
        ${S.store ? `<span class="filter">${esc(S.store)}<button data-clear="store" aria-label="매장 필터 해제">✕</button></span>` : ''}
      </div>
      ${rows.length ? `<table class="list"><thead><tr><th>날짜</th><th class="s">매장</th><th>상담 내용</th><th></th></tr></thead><tbody>
      ${rows.slice(0, S.shown).map((r) => `<tr>
        <td class="d num">${kst(r.opened_at, { month: 'numeric', day: 'numeric' })}<br><span class="muted">${kst(r.opened_at, { hour: '2-digit', minute: '2-digit' })}</span></td>
        <td class="s">${esc(r.store)}</td>
        <td class="m"><span class="store">${esc(r.store)}</span>${r.summary
          ? `<span class="sum">${esc(r.summary)}</span>`
          : esc(r.first_message) || '<span class="muted">(메시지 없음)</span>'}${r.estimated ? '<span class="badge" title="태그에 세부유형이 없어 메시지 내용으로 추정했어요">추정</span>' : ''}</td>
        <td class="go"><a href="${CHANNEL_DESK(encodeURIComponent(r.channel_id), encodeURIComponent(r.chat_id))}" target="_blank" rel="noopener">채널톡 ↗</a></td>
      </tr>`).join('')}</tbody></table>
      ${rows.length > S.shown ? `<button class="btn more" id="more">더 보기 (${(rows.length - S.shown).toLocaleString()}건 남음)</button>` : ''}`
      : '<p class="muted">조건에 맞는 문의가 없어요.</p>'}`;
  }

  el.innerHTML = `
    <div class="card">
      <div class="detail-head">
        <button class="btn back" id="back">← 유형 목록</button>
        <h2>${esc(t.name)}</h2>
        <span class="muted">최근 3개월 ${t.total}건 · 지난 보름 ${t.last}건 ${change(t.last, t.prev)}</span>
      </div>
      <p class="muted" style="margin:6px 0 0">막대를 누르면 그 기간 문의만 볼 수 있어요. 연한 막대는 아직 진행 중인 보름이에요.</p>
      <div class="trend">${P.map((p) => `<button class="${p === cur ? 'cur' : ''} ${S.period === p ? 'on' : ''} ${actPeriods.has(p) ? 'act' : ''}" data-period="${p}" title="${periodLabel(p)}: ${t.m[p] || 0}건${actPeriods.has(p) ? ' · 개선 조치' : ''}">
        ${actPeriods.has(p) ? '<span class="flag">조치</span>' : ''}<span class="v num">${t.m[p] || 0}</span><span class="bar" style="height:${((t.m[p] || 0) / max) * 100}%"></span>
        <span class="l">${shortLabel(p)}</span></button>`).join('')}</div>
    </div>
    <div class="card"><h3>개선 조치</h3>${actionsHtml}</div>
    <div class="card"><h3>매장별 ${S.period ? `(${periodLabel(S.period)})` : '(전체 기간)'}</h3>${storeChips}</div>
    <div class="card"><h3>문의 목록</h3>${listHtml}</div>`;

  el.querySelector('#back').onclick = () => { document.getElementById('layout').classList.remove('picked'); scrollTo({ top: 0 }); };
  for (const b of el.querySelectorAll('[data-period]')) b.onclick = () => { S.period = S.period === b.dataset.period ? null : b.dataset.period; S.shown = PAGE; writeHash(); renderDetail(); };
  for (const b of el.querySelectorAll('[data-store]')) b.onclick = () => { S.store = S.store === b.dataset.store ? null : b.dataset.store; S.shown = PAGE; writeHash(); renderDetail(); };
  for (const b of el.querySelectorAll('[data-clear]')) b.onclick = () => { S[b.dataset.clear] = null; S.shown = PAGE; writeHash(); renderDetail(); };
  el.querySelector('#more')?.addEventListener('click', () => { S.shown += PAGE; renderDetail(); });
  el.querySelector('#act-form').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('button');
    btn.disabled = true;
    const { error } = await db.from('actions').insert({ device_type: t.name, acted_on: f.d.value, note: f.n.value.trim() });
    if (error) { btn.disabled = false; alert('기록하지 못했어요: ' + error.message); return; }
    await reloadActions();
  };
  for (const b of el.querySelectorAll('[data-del]')) b.onclick = async () => {
    if (!confirm('이 조치 기록을 삭제할까요?')) return;
    const { error } = await db.from('actions').delete().eq('id', Number(b.dataset.del));
    if (error) { alert('삭제하지 못했어요: ' + error.message); return; }
    await reloadActions();
  };
  const trend = el.querySelector('.trend'); trend.scrollLeft = trend.scrollWidth; // 최근 구간이 보이게
}

// ── 공통 머리말 + 탭
async function shell(email) {
  S.email = email;
  readHash();
  const { data: ok } = await db.rpc('is_approver');
  S.approver = ok === true;
  app.innerHTML = `
    <header>
      <h1>기기 오작동 문의 유형</h1>
      <span class="muted">${esc(email)}${S.approver ? ' · 승인자' : ''} · <a href="#" id="out">로그아웃</a></span>
    </header>
    <nav class="tabs" role="tablist">${Object.entries(TABS).map(([k, v]) =>
      `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${v}<span class="cnt" id="cnt-${k}"></span></button>`).join('')}</nav>
    <div id="view"></div>`;
  document.getElementById('out').onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); location.hash = ''; login(); };
  for (const b of app.querySelectorAll('[data-tab]')) b.onclick = () => showTab(b.dataset.tab);
  showTab(S.tab);
  refreshPendingCount();
}

async function refreshPendingCount() {
  const { count } = await db.from('tag_suggestions').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  const el = document.getElementById('cnt-sugg');
  if (el) el.textContent = count ? ` ${count}` : '';
}

function showTab(tab) {
  S.tab = tab;
  for (const b of app.querySelectorAll('[data-tab]')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  writeHash();
  document.getElementById('view').innerHTML = '<p class="center muted">불러오는 중…</p>';
  ({ dash: () => dashboard(S.email), sugg: suggestions, crit: criteria })[tab]();
}

// ── 태그 제안 탭
const STATUS = { pending: '승인 대기', approved: '승인', rejected: '반려', dismissed: '거절' };
const tagChips = (tags, cls = '') => tags.map((t) => `<span class="tagchip ${cls}">${esc(t.replace(/^유형\//, ''))}</span>`).join(' ');

async function suggestions() {
  const view = document.getElementById('view');
  const counts = await Promise.all(Object.keys(STATUS).map((s) =>
    db.from('tag_suggestions').select('id', { count: 'exact', head: true }).eq('status', s).then((r) => r.count || 0)));
  const { data: rows, error } = await db.from('tag_suggestions')
    .select('id, chat_id, channel_id, opened_at, store, summary, current_tags, suggested_tags, reason, status, reject_reason, decided_by, decided_at, error')
    .eq('status', S.sugStatus).order('opened_at', { ascending: false }).range(0, S.sugShown - 1);
  if (S.tab !== 'sugg') return;
  if (error) { view.innerHTML = `<div class="warn">제안을 불러오지 못했어요: ${esc(error.message)}</div>`; return; }
  const total = counts[Object.keys(STATUS).indexOf(S.sugStatus)];
  view.innerHTML = `
    <div class="card">
      <p class="muted" style="margin-top:0">AI가 분류 기준으로 상담을 다시 읽고, 지금 태그와 다르게 판단한 상담이에요.
        ${S.approver ? '승인하면 채널톡 태그가 바뀌어요. 반려 사유는 기준을 고칠 때 참고해요.' : '승인·반려는 지정된 승인자만 할 수 있어요.'}</p>
      <div class="chips">${Object.entries(STATUS).map(([k, v], i) =>
        `<button class="chip ${S.sugStatus === k ? 'on' : ''}" data-status="${k}">${v}<b class="num">${counts[i]}</b></button>`).join('')}</div>
    </div>
    <div class="card">
      ${rows.length ? `<table class="list sugg"><thead><tr><th>날짜</th><th>상담</th><th>태그</th><th></th></tr></thead><tbody>
      ${rows.map((r) => `<tr>
        <td class="d num">${kst(r.opened_at, { month: 'numeric', day: 'numeric' })}<br><span class="muted">${esc(r.store)}</span></td>
        <td class="m">${r.summary ? `<span class="sum">${esc(r.summary)}</span>` : '<span class="muted">(요약 없음)</span>'}
          ${r.reason ? `<span class="why">AI 사유: ${esc(r.reason)}</span>` : ''}
          ${r.reject_reason ? `<span class="why rej">반려 사유: ${esc(r.reject_reason)}</span>` : ''}
          ${r.decided_by ? `<span class="muted small">${esc(STATUS[r.status])} · ${esc(r.decided_by.split('@')[0])} · ${kst(r.decided_at, { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>` : ''}
          ${r.error ? `<span class="why rej">오류: ${esc(r.error)}</span>` : ''}</td>
        <td class="tagcol">${tagChips(r.current_tags, 'old')} <span class="arrow">→</span> ${tagChips(r.suggested_tags, 'new')}</td>
        <td class="go">
          <a href="${CHANNEL_DESK(encodeURIComponent(r.channel_id), encodeURIComponent(r.chat_id))}" target="_blank" rel="noopener">채널톡 ↗</a>
          ${S.approver && r.status === 'pending' ? `<div class="acts-btns">
            <button class="btn primary sm" data-act="approve" data-id="${r.id}">승인</button>
            <button class="btn sm" data-act="reject" data-id="${r.id}">반려</button>
            <button class="btn sm" data-act="dismiss" data-id="${r.id}">거절</button></div>` : ''}
        </td></tr>`).join('')}</tbody></table>
      ${total > rows.length ? `<button class="btn more" id="sugmore">더 보기 (${(total - rows.length).toLocaleString()}건 남음)</button>` : ''}`
      : `<p class="muted">${STATUS[S.sugStatus]} 상태인 제안이 없어요.</p>`}
    </div>`;
  for (const b of view.querySelectorAll('[data-status]')) b.onclick = () => { S.sugStatus = b.dataset.status; S.sugShown = PAGE; suggestions(); };
  view.querySelector('#sugmore')?.addEventListener('click', () => { S.sugShown += PAGE; suggestions(); });
  for (const b of view.querySelectorAll('[data-act]')) b.onclick = () => review(Number(b.dataset.id), b.dataset.act, b);
}

async function review(id, action, btn) {
  let reason;
  if (action === 'reject') {
    reason = prompt('반려 사유를 적어주세요. (AI가 왜 틀렸는지 — 기준을 고칠 때 참고해요)');
    if (reason === null) return;
    if (!reason.trim()) { alert('반려 사유를 적어주세요.'); return; }
  }
  if (action === 'approve' && !confirm('채널톡 상담의 유형 태그를 제안대로 바꿀까요?')) return;
  for (const b of btn.parentElement.querySelectorAll('button')) b.disabled = true;
  const { data, error } = await sb.functions.invoke('review-suggestion', { body: { id, action, reason } });
  if (error) {
    let msg = error.message;
    try { msg = (await error.context.json()).error || msg; } catch {}
    alert('처리하지 못했어요: ' + msg);
    for (const b of btn.parentElement.querySelectorAll('button')) b.disabled = false;
    return;
  }
  await suggestions();
  refreshPendingCount();
}

// ── 분류 기준 탭
async function criteria() {
  const view = document.getElementById('view');
  const { data: rows, error } = await db.from('tag_criteria').select('tag, channel_description, criteria, updated_by, updated_at').order('tag');
  if (S.tab !== 'crit') return;
  if (error) { view.innerHTML = `<div class="warn">기준을 불러오지 못했어요: ${esc(error.message)}</div>`; return; }
  const filled = rows.filter((r) => r.criteria).length;
  view.innerHTML = `
    <div class="card">
      <p class="muted" style="margin-top:0">AI는 이 기준으로 상담의 유형 태그를 판단해요. 기준이 비어 있으면 채널톡 태그 설명을, 그것도 없으면 태그 이름으로 판단해요.
        태그 목록은 매일 채널톡에서 가져와요. ${S.approver ? '' : '기준 수정은 지정된 승인자만 할 수 있어요.'}</p>
      <input type="search" id="critq" class="search" placeholder="태그 검색" aria-label="태그 검색">
      <span class="muted">기준 작성 ${filled} / ${rows.length}개</span>
    </div>
    <div class="card">${rows.length ? `<table class="list crit"><thead><tr><th>태그</th><th>기준</th></tr></thead><tbody>
      ${rows.map((r) => `<tr data-tag="${esc(r.tag)}">
        <td class="tagname">${esc(r.tag.replace(/^유형\//, ''))}${r.channel_description ? `<span class="muted small">채널톡 설명: ${esc(r.channel_description)}</span>` : ''}</td>
        <td>${S.approver
          ? `<textarea maxlength="1000" rows="2" placeholder="이럴 때 이 태그를 붙여요 (예: 결제 후 건조기가 돌지 않거나 건조가 덜 된 경우. 고객 조작 실수는 제외)">${esc(r.criteria)}</textarea>
             <div class="critbar"><button class="btn sm primary" data-save>저장</button><span class="muted small saved">${r.updated_by ? `${esc(r.updated_by.split('@')[0])} · ${kst(r.updated_at, { month: 'numeric', day: 'numeric' })}` : ''}</span></div>`
          : (esc(r.criteria) || '<span class="muted">(기준 없음)</span>')}</td></tr>`).join('')}</tbody></table>`
      : '<p class="muted">아직 태그 목록이 없어요. 다음 분류 실행 때 채널톡에서 가져와요.</p>'}</div>`;
  view.querySelector('#critq').oninput = (e) => {
    const q = e.target.value.trim();
    for (const tr of view.querySelectorAll('tr[data-tag]')) tr.hidden = q && !tr.dataset.tag.includes(q);
  };
  for (const b of view.querySelectorAll('[data-save]')) b.onclick = async () => {
    const tr = b.closest('tr'), text = tr.querySelector('textarea').value.trim();
    b.disabled = true;
    const { error } = await db.from('tag_criteria')
      .update({ criteria: text, updated_by: S.email, updated_at: new Date().toISOString() }).eq('tag', tr.dataset.tag);
    b.disabled = false;
    tr.querySelector('.saved').textContent = error ? '저장 실패: ' + error.message : '저장됨';
  };
}

async function reloadActions() {
  const { data } = await db.from('actions').select('id, device_type, acted_on, note, created_by').order('acted_on');
  S.actions = data || [];
  renderDetail();
}

async function route(session) {
  if (!session) return login();
  const email = session.user.email || '';
  if (email.toLowerCase().split('@')[1] !== COMPANY_DOMAIN) return notCompany(email);
  shell(email);
}

let shown = false;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
    if (event === 'SIGNED_IN' && shown) return; // 토큰 갱신 등으로 다시 그리지 않는다
    shown = true;
    route(session);
  }
});
</script>
</body>
</html>
